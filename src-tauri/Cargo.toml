[package]
name = "arkamon"
version = "0.1.0"
description = "Arkamon desktop"
authors = ["Arkamon"]
edition = "2021"

[lib]
name = "arkamon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Media are installer resources instead of Rust code-generation inputs. Keep
# the bounded frontend uncompressed here and compress the installable package;
# the other default Tauri features remain enabled.
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6", "dynamic-acl", "x11", "dbus"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
