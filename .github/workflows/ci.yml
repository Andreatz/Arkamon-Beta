name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Audit fase 7: il gruppo nativo e il budget di avvio girano anche ogni notte, senza bloccare Pages.
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: verified-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Audit fase 7: pubblicazione web. Unit, build, flussi browser e release compilata
  # decidono da soli se Pages viene aggiornato. Il gruppo nativo vive in `native-release`.
  test-build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --maxWorkers=4 --reporter=default --reporter=json --outputFile=output/ci/unit.json

      - name: Release and relay contracts
        run: node --test scripts/__tests__/release-verification.test.mjs scripts/__tests__/public-relay.test.mjs scripts/__tests__/public-media-relay.test.mjs scripts/__tests__/startup-budget.test.mjs scripts/__tests__/desktop-resources.test.mjs scripts/__tests__/repo-weight-report.test.mjs

      - name: UI asset imports and splash catalog
        run: npm run test:ui-assets

      - name: Build dependency security regressions
        run: npm run test:security

      - name: Runtime catalog consistency
        run: |
          npm run assets:catalog:check
          npm run media:catalog
          node scripts/build-runtime-game-data.mjs --check

      - name: Build the release artifact once
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Verify bounded web package
        run: test -f dist/media-release.json

      # Il budget di avvio resta misurato a ogni build, ma è vincolante solo in `native-release`:
      # oggi è già superato su main e bloccava ogni pubblicazione.
      - name: Startup budget (report)
        continue-on-error: true
        run: node scripts/check-startup-budget.mjs || { echo "::warning title=Budget di avvio::Il pacchetto supera il budget di avvio (vedi il job native-release)."; exit 1; }

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser flows and accessibility
        run: npm run test:e2e -- --grep-invert 'native-(import|pages|runtime-metadata)' --reporter=list,blob --output=output/ci/browser-general
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: output/ci/browser-blobs

      - name: Merge the browser group with the official reporter
        run: npx playwright merge-reports --reporter=json output/ci/browser-blobs
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: output/ci/browser.json

      - name: Compiled release and isolated broadcast profiles
        run: npx playwright test --config playwright.release.config.ts

      - name: Seal the verified web artifact
        run: |
          node scripts/release-verification.mjs seal --scope web --dist dist --revision "$GITHUB_SHA" --unit output/ci/unit.json --browser output/ci/browser.json --compiled output/ci/compiled.json
          node scripts/release-verification.mjs verify --scope web --dist dist --revision "$GITHUB_SHA"

      - name: Upload the verified Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Verification artifacts
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-verification
          path: |
            output/ci/
            playwright-report/
            test-results/
          retention-days: 7

  # Audit fase 7: animazioni native, VFX compilati e budget di avvio. Non blocca Pages:
  # gira dopo la build web su main, ogni notte e a richiesta, e riporta l'esito a parte.
  native-release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the same release artifact
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Startup budget
        run: node scripts/check-startup-budget.mjs

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Native animation sources and playback budgets
        run: npm run test:e2e -- --grep 'native-(import|pages|runtime-metadata)' --reporter=list

      - name: Compiled native actions and VFX against the same artifact
        run: npx playwright test --config playwright.native-release.config.ts

      - name: Native verification artifacts
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: native-verification
          path: |
            output/ci/
            test-results/
          retention-days: 7

  deploy:
    needs: test-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the artifact verified by this run
        id: deployment
        uses: actions/deploy-pages@v4
