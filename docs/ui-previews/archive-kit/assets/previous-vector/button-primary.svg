<svg width="646" height="192" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 646 192" role="img" aria-labelledby="title"><title id="title">Pulsante vuoto viola luminoso</title><desc>Ricreazione interpretata del kit viola con geometrie regolari, curve pulite, gradienti e bagliori SVG nativi. Nessun ricalco di pixel, maschera raster o immagine incorporata.</desc><defs>
