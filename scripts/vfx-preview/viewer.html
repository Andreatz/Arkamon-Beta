<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arkamon · Atlante delle mosse</title>
<style>
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:#0d1521;color:#f5f4ee;font:16px/1.45 system-ui,sans-serif}main{max-width:1140px;margin:auto;padding:clamp(18px,4vw,52px)}h1,h2{margin:0;font-family:Georgia,serif;font-weight:500;line-height:1.08}h1{font-size:clamp(30px,5vw,56px)}h2{font-size:clamp(26px,3.4vw,43px)}header{display:flex;align-items:end;justify-content:space-between;border-bottom:1px solid #3c4e5f;padding-bottom:19px;gap:12px}header p{margin:0;color:#a7bdd1}.grid{display:grid;grid-template-columns:minmax(220px,30%) 1fr;gap:26px;margin-top:28px}label{display:block;font-size:13px;font-weight:650;color:#c4d3e0}input,button,select{font:inherit}input[type=search]{font-size:16px;margin:7px 0 12px;background:#162333;color:white;border:1px solid #51677e;padding:11px 12px;width:100%;border-radius:6px}#list{display:flex;flex-direction:column;gap:2px;max-height:515px;overflow:auto;padding-right:4px}button{cursor:pointer;color:inherit;border:1px solid #52697c;border-radius:5px;background:#1b2b3d;padding:7px 12px}button:disabled{cursor:default;opacity:.5}#list button{border:0;display:block;text-align:left;background:transparent;border-left:3px solid transparent;border-radius:0}#list button[aria-current=true]{border-color:#edbf75;background:#203347}button:hover,#list button:hover{background:#293d50}button:focus-visible,input:focus-visible{outline:2px solid #ffe3a4;outline-offset:1px}small{display:block;font-size:12px;color:#b4c8da}#detail{margin:7px 0 14px;color:#b9cad8}#stage{position:relative;isolation:isolate;overflow:hidden;aspect-ratio:1.88;border:1px solid #485965;border-radius:9px;background:radial-gradient(ellipse at 66% 85%,#2d4753 0,transparent 54%),linear-gradient(155deg,#162032,#172936 65%,#121e29)}#stage img{position:absolute;width:25%;height:49%;object-fit:contain;transform:translate(-50%,-50%);filter:drop-shadow(0 8px 6px #0007)}#actor{left:26%;top:64%}#enemy{left:72%;top:48%}#stage.self #actor{left:50%;top:54%}#stage.self #enemy{display:none}canvas{width:100%;height:100%;position:absolute;inset:0}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:15px}#play{min-width:102px;background:#edc082;color:#182331;border-color:#edc082;font-weight:700}#time{font-variant-numeric:tabular-nums;color:#bdccda;margin-left:auto;font-size:13px}.timeline{margin-top:15px}.timeline input{width:100%;accent-color:#edc082;margin:7px 0 0}#status{color:#c6d6df}.empty{color:#d9cbab;padding:8px}p{margin:.45em 0}button,input{touch-action:manipulation}@media(max-width:700px){main{padding:16px}header{display:block}header p{margin-top:5px}.grid{display:flex;flex-direction:column;gap:17px;margin-top:16px}#list{max-height:126px}#stage{aspect-ratio:1.7}.controls{gap:5px}button{padding:6px 9px}.timeline{margin-top:9px}}
</style>
<main><header><h1>Atlante delle mosse</h1><p id="totals"></p></header><div class="grid"><aside><label for="search">Cerca una mossa, un tipo o un Arkamon</label><input id="search" type="search" placeholder="Es. Boro Breath" autocomplete="off"><nav id="list" aria-label="Varianti delle mosse"></nav><p id="empty" class="empty" hidden>Nessuna variante corrisponde alla ricerca.</p></aside>
<section><h2 id="name"></h2><p id="detail"></p><div id="stage"><img id="actor" alt=""><img id="enemy" alt=""><canvas aria-label="Animazione della mossa"></canvas></div><div class="controls"><button id="play" type="button">Riproduci</button><button id="peak" type="button">Impatto</button><span id="time"></span></div><label class="timeline" for="scrub">Fotogramma<input id="scrub" type="range" min="0" step="1" value="0"></label><p id="status" role="status"></p></section></div></main>
<!--CATALOG--><!--PLAYER--></html>
